version: "3.9"

services:
  stag:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # local demo: the API has no authentication; keep it loopback-bound
    environment:
      - STREAM_SOURCE=simulator
      - TECHOPS_COORDINATOR_ENABLED=true
      - SIMULATOR_INTERVAL=3.0
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - GRAPH_PERSIST_PATH=/app/data/graph.json
      - CONTROL_STORE_URL=sqlite:////app/data/control.sqlite
    volumes:
      - stag-data:/app/data
    restart: unless-stopped

  # Optional single-node Kafka (KRaft). Start with: docker compose --profile kafka up
  # and point STAG at it with STREAM_SOURCE=kafka KAFKA_BOOTSTRAP_SERVERS=kafka:9092.
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["kafka"]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  stag-data:
